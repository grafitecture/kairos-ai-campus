<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>KAIROS AI Campus – Claude verstehen und sicher nutzen</title>
  <meta name="description" content="KAIROS AI Campus: Workshop zu Claude – Möglichkeiten, Grenzen, Datenschutz, Sicherheit und Governance. Deutsch und Englisch.">
  <link rel="icon" type="image/png" href="assets/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/source-sans-3-vf.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/content-base.js" defer></script>
  <script src="assets/content-slides.js" defer></script>
  <script src="assets/content-deep.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body class="at-prolog">
  <a class="skip" href="#deck" data-i18n="skip">Zum Inhalt springen</a>

  <div class="progress" aria-hidden="true"><span class="progress__bar"></span></div>

  <header class="topbar">
    <a class="topbar__logo" href="#prolog" aria-label="KAIROS AI Campus – zum Anfang">
      <img src="assets/brand/kairos-logo.png" width="412" height="122" alt="KAIROS">
      <span class="topbar__campus">AI Campus</span>
    </a>
    <p class="topbar__chapter" aria-live="polite"></p>
    <nav class="topbar__tools" aria-label="Werkzeuge">
      <button type="button" class="tool" data-action="overview" aria-haspopup="dialog"><span data-i18n="overview">Übersicht</span></button>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" class="lang__btn" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" class="lang__btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="tool tool--icon" data-action="fullscreen" aria-label="Vollbild">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </nav>
  </header>

  <main id="deck" class="deck" tabindex="-1">
    <noscript><p class="noscript">Diese Präsentation braucht JavaScript. / This presentation needs JavaScript.</p></noscript>
  </main>

  <aside class="voice" aria-label="Jens Sattler">
    <button type="button" class="voice__toggle" aria-expanded="true" data-i18n-label="voiceToggle" aria-label="Jens Sattler ein- oder ausklappen">
      <span class="voice__portrait"><img src="assets/img/jens-portrait-800.webp" alt="" width="800" height="800"></span>
      <span class="voice__name">Jens Sattler</span>
    </button>
    <figure class="voice__body">
      <blockquote class="voice__quote" aria-live="polite"><p></p></blockquote>
      <figcaption class="voice__meta"></figcaption>
    </figure>
    <div class="voice__nav">
      <button type="button" class="voice__step" data-action="prev" aria-label="Vorherige Folie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="voice__count"></span>
      <button type="button" class="voice__step" data-action="next" aria-label="Nächste Folie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </aside>

  <dialog class="sheet" id="deep" aria-labelledby="deep-title">
    <div class="sheet__inner">
      <p class="sheet__kicker" data-i18n="deepKicker">Vertiefung</p>
      <h2 class="sheet__title" id="deep-title"></h2>
      <div class="sheet__body"></div>
      <button type="button" class="sheet__close" data-action="close"><span data-i18n="close">Schließen</span></button>
    </div>
  </dialog>

  <dialog class="sheet sheet--overview" id="overview" aria-labelledby="overview-title">
    <div class="sheet__inner">
      <h2 class="sheet__title" id="overview-title" data-i18n="overview">Übersicht</h2>
      <ol class="overview"></ol>
      <p class="overview__keys" data-i18n="keys">Tasten: ↓ / → weiter, ↑ / ← zurück, O Übersicht, F Vollbild, E/D Sprache.</p>
      <button type="button" class="sheet__close" data-action="close"><span data-i18n="close">Schließen</span></button>
    </div>
  </dialog>

  <div class="tip" role="tooltip" id="tip" hidden><strong class="tip__term"></strong><span class="tip__def"></span></div>
</body>
</html>
